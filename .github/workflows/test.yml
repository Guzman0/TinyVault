name: test
on: [push, pull_request, workflow_dispatch]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: foundry-rs/foundry-toolchain@v1
        with:
          version: v1.5.1
      - name: Unit tests
        run: forge test --no-match-contract Fork -vv
      - name: Fork tests against Mezo testnet
        shell: bash
        env:
          MEZO_RPC: https://rpc.test.mezo.org
          FOUNDRY_PROFILE: fork
        run: |
          set +e
          forge test --match-contract 'TinyVaultForkTest$' -vv 2>&1 | tee fork.txt
          s1=${PIPESTATUS[0]}
          forge test --match-contract Redemption --match-test redemption -vv 2>&1 | tee redemption.txt
          s2=${PIPESTATUS[0]}
          grep -hE "FAIL|Error|error" fork.txt redemption.txt | head -20 | sed 's/^/::error::/'
          exit $(( s1 | s2 ))
