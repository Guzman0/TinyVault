name: keeper

# Checks every TinyVault account on Mezo testnet every 15 minutes and closes any below 125%.
# Without a key it only reports, so the log is a public record of every account's health.
# To let it close accounts, add a repository secret KEEPER_PRIVATE_KEY for a wallet holding
# MUSD and a little testnet BTC. The closer earns 5% on each close.
on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:

concurrency:
  group: keeper
  cancel-in-progress: false

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: keeper
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --no-audit --no-fund
      - name: Scan and close
        env:
          PRIVATE_KEY: ${{ secrets.KEEPER_PRIVATE_KEY }}
        run: |
          [ -n "$PRIVATE_KEY" ] || unset PRIVATE_KEY
          node keeper.mjs | tee -a "$GITHUB_STEP_SUMMARY"
      - name: Scan and close the stress-test vault
        env:
          PRIVATE_KEY: ${{ secrets.KEEPER_PRIVATE_KEY }}
          # Second vault with tight settings (borrow to 116.5%, close below 115%); see README.
          VAULT: "0x41b230d37bB10cc005803CD780357d24Ae162731"
          FROM_BLOCK: "16781176"
        run: |
          [ -n "$VAULT" ] || { echo "No stress-test vault yet."; exit 0; }
          [ -n "$PRIVATE_KEY" ] || unset PRIVATE_KEY
          { echo; echo "## Stress-test vault"; } >> "$GITHUB_STEP_SUMMARY"
          node keeper.mjs | tee -a "$GITHUB_STEP_SUMMARY"
